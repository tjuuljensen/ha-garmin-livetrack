# Garmin LiveTrack notification package (unverified example)
#
# Setup:
# 1. Load this file as a Home Assistant package:
#    https://www.home-assistant.io/docs/configuration/packages/
# 2. Set input_text.garmin_livetrack_notify_service to an existing notify action,
#    for example notify.mobile_app_your_phone.
# 3. Choose generic, android, or ios in input_select.garmin_livetrack_mobile_platform.
# 4. Turn on input_boolean.garmin_livetrack_notifications. Optionally enable
#    input_boolean.garmin_livetrack_clear_notifications for clearing after 5 minutes.
# 5. Test delivery on your Home Assistant and mobile clients before relying on it.
#    Companion notification options:
#    https://companion.home-assistant.io/docs/notifications/notifications-basic/
#
# Uses user, activity_type, distance_km, duration_hms, status, and reason from
# the integration events. Missing names and metrics are handled explicitly.
# Lifecycle events do not contain LiveTrack URLs; notification taps open a
# Home Assistant dashboard. Change target_path in the script calls if needed.
# Names and activity summaries are sent to the selected notification service.
# Notifications reuse a tag per user, including concurrent sessions for that user.
# A session-added event means tracking was accepted, not necessarily that the
# activity has produced its first GPS point. Manual stops arrive as updated events.
#
# Platform-specific delivery and clearing have not been validated on live devices.

input_boolean:
  garmin_livetrack_notifications:
    name: Garmin LiveTrack Notifications
    icon: mdi:message-text-fast-outline

  garmin_livetrack_clear_notifications:
    name: Garmin LiveTrack Clear Notifications
    icon: mdi:message-check-outline

input_select:
  garmin_livetrack_mobile_platform:
    name: Garmin LiveTrack Mobile Platform
    icon: mdi:cellphone-message
    options:
      - generic
      - android
      - ios

input_text:
  garmin_livetrack_notify_service:
    name: Garmin LiveTrack Notify Service
    icon: mdi:bullhorn

script:
  garmin_livetrack_notify:
    alias: Garmin LiveTrack Notify
    mode: parallel
    max: 20
    fields:
      title:
        required: true
        selector:
          text:
      message:
        required: true
        selector:
          text:
      garmin_user:
        required: true
        selector:
          text:
      target_path:
        required: false
        selector:
          text:
      priority:
        required: false
        selector:
          select:
            options:
              - normal
              - high
      clear_after:
        required: false
        selector:
          boolean:
    sequence:
      - condition: state
        entity_id: input_boolean.garmin_livetrack_notifications
        state: "on"

      - variables:
          notify_service: "{{ states('input_text.garmin_livetrack_notify_service') }}"
          platform: "{{ states('input_select.garmin_livetrack_mobile_platform') }}"
          user_slug: >-
            {{ garmin_user | default('unknown', true) | lower
               | regex_replace(find='[^a-z0-9]+', replace='_')
               | regex_replace(find='(^_|_$)', replace='') }}
          tag_value: "garmin_livetrack_{{ user_slug }}"
          group_value: "garmin_livetrack"
          url_value: "{{ target_path | default('/lovelace', true) }}"
          priority_value: "{{ priority | default('normal') }}"
          clear_enabled: "{{ clear_after | default(false) }}"

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ platform == 'android' }}"
            sequence:
              - action: "{{ notify_service }}"
                data:
                  title: "{{ title }}"
                  message: "{{ message }}"
                  data:
                    tag: "{{ tag_value }}"
                    group: "{{ group_value }}"
                    channel: Garmin LiveTrack
                    importance: high
                    priority: "{{ 'high' if priority_value == 'high' else 'default' }}"
                    notification_icon: mdi:map-marker-path
                    clickAction: "{{ url_value }}"
                    sticky: "{{ priority_value == 'high' }}"
                    vibrationPattern: "100, 1000, 100, 1000"

          - conditions:
              - condition: template
                value_template: "{{ platform == 'ios' }}"
            sequence:
              - action: "{{ notify_service }}"
                data:
                  title: "{{ title }}"
                  message: "{{ message }}"
                  data:
                    tag: "{{ tag_value }}"
                    group: "{{ group_value }}"
                    url: "{{ url_value }}"
                    push:
                      interruption-level: "{{ 'time-sensitive' if priority_value == 'high' else 'active' }}"
                      sound:
                        name: default

        default:
          - action: "{{ notify_service }}"
            data:
              title: "{{ title }}"
              message: "{{ message }}"
              data:
                tag: "{{ tag_value }}"
                group: "{{ group_value }}"
                url: "{{ url_value }}"

      - if:
          - condition: template
            value_template: >-
              {{ clear_enabled
                 and is_state('input_boolean.garmin_livetrack_clear_notifications', 'on') }}
        then:
          - delay: "00:05:00"
          - action: "{{ notify_service }}"
            data:
              message: clear_notification
              data:
                tag: "{{ tag_value }}"

automation:
  - alias: Garmin LiveTrack - Notify Session Started
    id: garmin_livetrack_notify_session_started
    mode: queued
    max: 20
    triggers:
      - trigger: event
        event_type: garmin_livetrack_session_added
    variables:
      garmin_user: "{{ trigger.event.data.user | default('Garmin user', true) }}"
      first_name: "{{ garmin_user.split(' ')[0] }}"
      activity: "{{ trigger.event.data.activity_type | default('activity', true) }}"
      target_path: "/lovelace"
    actions:
      - action: script.garmin_livetrack_notify
        data:
          title: LiveTrack
          message: >-
            LiveTrack tracking accepted for {{ first_name }} ({{ activity }}).
          garmin_user: "{{ garmin_user }}"
          target_path: "{{ target_path }}"
          priority: high
          clear_after: false

  - alias: Garmin LiveTrack - Notify Session Ended
    id: garmin_livetrack_notify_session_ended
    mode: queued
    max: 20
    triggers:
      - trigger: event
        event_type: garmin_livetrack_session_ended
      - trigger: event
        event_type: garmin_livetrack_session_updated
        event_data:
          status: stopped
    variables:
      garmin_user: "{{ trigger.event.data.user | default('Garmin user', true) }}"
      first_name: "{{ garmin_user.split(' ')[0] }}"
      activity: "{{ trigger.event.data.activity_type | default('activity', true) }}"
      distance_km: "{{ trigger.event.data.distance_km | default(none) }}"
      duration: "{{ trigger.event.data.duration_hms | default(none) }}"
      target_path: "/lovelace"
      message_text: >-
        {{ first_name }}: {{ activity }} session {{ trigger.event.data.status }}
        {% if distance_km not in [none, '', 'unknown', 'unavailable'] %}
          - {{ distance_km }} km
        {% endif %}
        {% if duration not in [none, '', 'unknown', 'unavailable'] %}
          in {{ duration }}
        {% endif %}. Reason: {{ trigger.event.data.reason | default('unknown', true) }}.
    actions:
      - action: script.garmin_livetrack_notify
        data:
          title: LiveTrack
          message: "{{ message_text }}"
          garmin_user: "{{ garmin_user }}"
          target_path: "{{ target_path }}"
          priority: normal
          clear_after: true

  - alias: Garmin LiveTrack - Notify Session Rejected
    id: garmin_livetrack_notify_session_rejected
    mode: queued
    max: 20
    triggers:
      - trigger: event
        event_type: garmin_livetrack_session_rejected
    variables:
      garmin_user: "{{ trigger.event.data.user | default('Garmin user', true) }}"
      reason: "{{ trigger.event.data.reason | default('rejected by integration policy') }}"
    actions:
      - action: script.garmin_livetrack_notify
        data:
          title: LiveTrack rejected
          message: "{{ garmin_user }} was not tracked: {{ reason }}."
          garmin_user: "{{ garmin_user }}"
          target_path: "/config/integrations"
          priority: normal
          clear_after: true
