add_url:
  name: Add URL
  description: Add a Garmin LiveTrack URL manually.
  fields:
    url:
      required: true
      selector:
        text:
stop_session:
  name: Stop Session
  description: Stop one active LiveTrack session. Supply session_id or session_id_hash.
  fields:
    session_id:
      required: false
      selector:
        text:
    session_id_hash:
      required: false
      selector:
        text:
clear_ended:
  name: Clear Ended
  description: Clear ended sessions.
reload_users:
  name: Reload Users
  description: Reload known users from storage.
refresh_session:
  name: Refresh Session
  description: Request a refresh for one active session using session_id or session_id_hash. Transport backoff still applies.
  fields:
    session_id:
      required: false
      selector:
        text:
    session_id_hash:
      required: false
      selector:
        text:
refresh_all:
  name: Refresh All
  description: Request a refresh for all active sessions. Transport backoff still applies.
set_user_policy:
  name: Set User Policy
  description: Update user tracking policy and activity overrides.
  fields:
    user:
      required: true
      selector:
        text:
    enabled:
      required: false
      selector:
        boolean:
    mode:
      required: false
      selector:
        select:
          options:
            - normal
            - register_only
            - one_event_only
    allowed_activities:
      required: false
      selector:
        text:
remove_user:
  name: Remove User
  description: Remove a user, stop their active sessions, and purge their retained summaries and registered entities.
  fields:
    user:
      required: true
      selector:
        text:
list_users:
  name: List Users
  description: List configured Garmin LiveTrack users and policy settings.
